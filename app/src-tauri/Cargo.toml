[package]
name = "claude-widget"
version = "0.1.0"
edition = "2021"
default-run = "claude-widget"

[[bin]]
name = "claude-widget"
path = "src/main.rs"

[[bin]]
name = "claude-widget-hook"
path = "src/bin/hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
